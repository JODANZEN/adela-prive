<body data-page="atelier" data-title="meta.atelier">
<div id="site-header"></div>
<main id="main">
  <img class="ribbon ribbon--right ribbon--pagehead" src="assets/img/ribbon.svg" alt="">

<div class="wrap">
  <header class="page-head">
    <div class="tagline">Couture Handknits</div>
    <h1 style="margin-top:20px" data-i18n="atelier.title">The atelier</h1>

</div>
<section class="section" style="padding-top:24px">

    <div class="photo"><img src="assets/img/atelier-label-red.webp" alt="Adela Privé label on a red wine purse" loading="lazy"></div>

      <p class="lead" data-i18n="atelier.story.p1"></p>
      <p data-i18n="atelier.story.p2"></p>

  </div>

  <img class="statement__mono" src="assets/img/monogram-ivory.svg" alt="">

<section class="section">

    <div class="section-head"><h2 data-i18n="atelier.process.title"></h2></div>

<div class="wrap atelier-cta"><a class="btn" href="contact.html" data-i18n="atelier.cta">Ask about a piece</a></div>
