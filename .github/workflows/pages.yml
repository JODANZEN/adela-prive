# The site now lives on Cloudflare (www.adelaprive.com), which rebuilds on every push.
# GitHub Pages only forwards old jodanzen.github.io/adela-prive links to the new domain.
name: Forward old GitHub Pages links

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redirect pages only
        run: mkdir fwd && cp scripts/redirect.html fwd/index.html && cp scripts/redirect.html fwd/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fwd

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
