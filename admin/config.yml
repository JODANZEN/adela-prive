# Admin page for Adela Privé (Sveltia CMS) — https://sveltiacms.app
# Each piece is one file in content/products/. Saving here commits to GitHub;
# the GitHub Action then rebuilds the site (about a minute).

backend:
  name: github
  repo: JODANZEN/adela-prive
  branch: main
  # Sign-in helper (Cloudflare worker, see admin/README.md) for the "Sign In with GitHub" button
  base_url: https://sveltia-cms-auth.jdsn2101.workers.dev
  commit_messages:
    create: "Add piece: {{slug}}"
    update: "Update piece: {{slug}}"
    delete: "Remove piece: {{slug}}"
    uploadMedia: "Upload photo: {{path}}"
    deleteMedia: "Delete photo: {{path}}"

app_title: Adela Privé — Admin
site_url: https://www.adelaprive.com/
display_url: https://www.adelaprive.com/
logo:
  src: https://www.adelaprive.com/assets/img/favicon.svg

media_folder: assets/uploads
public_folder: /assets/uploads

media_libraries:
  default:
    config:
      max_file_size: 25000000
      filename_template: "{{slug}}-{{uuid_short}}"
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1400
          height: 1750

collections:
  - name: products
    label: Pieces · Артикули
    label_singular: Piece · Артикул
    description: Tap a piece to edit it, or New to add one. Changes are live about a minute after you save · Изберете артикул, за да го редактирате, или New за нов. Промените излизат на сайта около минута след запазване.
    folder: content/products
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: name_en
    slug: "{{slug}}"
    summary: "{{ref}} · {{name_en}} · {{status}} · {{price}}"
    sortable_fields:
      fields: [order, name_en, status, price]
      default: { field: order, direction: ascending }
    fields:
      # ---- the things she changes most ----
      - label: Photos · Снимки
        name: images
        widget: image
        multiple: true
        required: true
        hint: "Studio photo first, then open/full view, then on a model. Drag to reorder · Първо студийна снимка, после отворена, после на модел. Плъзнете за смяна на реда."

      - label: Availability · Наличност
        name: status
        widget: select
        default: available
        options:
          - { label: "Available · Налично", value: available }
          - { label: "Made to order · По поръчка", value: made-to-order }
          - { label: "Sold out · Изчерпано", value: sold }

      - label: Price · Цена
        name: price
        widget: string
        required: false
        hint: "e.g. €45. Empty = “Price on request” · Напр. €45. Празно = „Цена при запитване“."

      # ---- names and text ----
      - label: Name (English)
        name: name_en
        widget: string

      - label: Име (български)
        name: name_bg
        widget: string
        required: false
        hint: If empty, the English name is used · Ако е празно, се показва английското име.

      - label: Description (English)
        name: description_en
        widget: text
        required: false

      - label: Описание (български)
        name: description_bg
        widget: text
        required: false

      # ---- details ----
      - label: Type · Вид
        name: category
        widget: select
        default: purses
        options:
          - { label: "Bag · Чанта", value: purses }
          - { label: "Accessory · Аксесоар", value: scarves }

      - label: Size · Размер
        name: dimensions
        widget: string
        required: false
        hint: e.g. 28 × 15 cm

      - label: Colour (English)
        name: colour_en
        widget: string
        required: false

      - label: Цвят (български)
        name: colour_bg
        widget: string
        required: false

      - label: Material (English)
        name: material_en
        widget: string
        required: false
        hint: Use the same wording as other pieces (e.g. T-shirt yarn) so the material filter groups them · Пишете материала еднакво, за да работи филтърът.

      - label: Материал (български)
        name: material_bg
        widget: string
        required: false

      # ---- set once, rarely changed ----
      - label: Reference code · Код
        name: ref
        widget: string
        required: false
        hint: Shown on the piece and in order messages. Next free number, e.g. AP-16 · Следващият свободен номер, напр. AP-16.

      - label: Show on the home page · На началната страница
        name: featured
        widget: boolean
        default: false
        hint: Up to four pieces are shown · Показват се до четири.

      - label: Big home-page photo links here · Голямата снимка води тук
        name: hero
        widget: boolean
        default: false
        hint: One piece only · Само за един артикул.

      - label: Position in the collection · Позиция
        name: order
        widget: number
        value_type: int
        default: 200
        required: false
        hint: Lower numbers come first (current pieces use 10–150) · По-малките числа излизат първи.
