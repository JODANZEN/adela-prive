<body data-page="home" data-title="meta.home">

<section class="hero" aria-labelledby="hero-h">
  <svg class="hero__thread" viewBox="0 0 1440 820" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <clipPath id="clip-wine" clipPathUnits="objectBoundingBox"><rect x="0" y="0" width=".41" height="1"/></clipPath>
      <clipPath id="clip-ivory" clipPathUnits="objectBoundingBox"><rect x=".41" y="0" width=".59" height="1"/></clipPath>
    </defs>
    <g clip-path="url(#clip-wine)"><rect width="1440" height="820" fill="none"/><path d="M-20 720 C 110 640, 220 420, 420 330 C 560 268, 640 150, 760 96 C 900 34, 1120 26, 1270 92 C 1360 132, 1392 214, 1340 238 C 1286 262, 1240 196, 1300 150 C 1350 112, 1410 104, 1470 112" class="t2" pathLength="1" vector-effect="non-scaling-stroke"/></g>

  <img class="hero__mono" src="assets/img/monogram-ivory.svg" alt="">
  <div class="hero__frame-wrap"><div class="hero__frame" id="hero-photo"></div></div>
  <div class="hero__copy">
    <div class="tagline">Couture Handknits</div>
    <h1 id="hero-h" data-i18n="hero.title">Unique crochet bags</h1>

      <a class="btn" href="collection.html" data-i18n="hero.cta">View the collection</a>
      <a class="link" href="#how-to-buy" data-i18n="hero.cta2">How to buy</a>
    </div>
  </div>
</section>

<section class="section has-ribbon" aria-labelledby="col-h">
  <img class="ribbon ribbon--right" style="bottom:8px" src="assets/img/ribbon.svg" alt="">
  <div class="wrap">
    <div class="section-head">
      <h2 id="col-h" class="duo" data-duo="collection">My Collection</h2>
      <p data-i18n="home.collection.text"></p>
    </div>
    <div class="grid grid--stagger" id="featured"></div>
    <p style="margin-top:64px;text-align:center"><a class="btn btn--ghost" href="collection.html" data-i18n="home.collection.all">See all pieces</a></p>
  </div>
</section>

<section class="statement on-wine">
  <img class="statement__mono" src="assets/img/monogram-ivory.svg" alt="">
  <div class="wrap"><blockquote data-i18n="statement.home"></blockquote></div>
</section>

<section class="section" id="how-to-buy" aria-labelledby="buy-h">
  <div class="wrap">
    <div class="section-head">
      <h2 id="buy-h" class="duo" data-duo="buy">How to buy</h2>
      <p data-i18n="order.text"></p>
    </div>

      <li class="step"><span class="step__num" aria-hidden="true">I</span><h3 data-i18n="order.s1.title"></h3><p data-i18n="order.s1.text"></p></li>

    </ol>
    <div class="hero__ctas" style="margin-top:56px">
      <a class="btn" data-href="ig" target="_blank" rel="noopener" data-i18n="btn.instagram">Message on Instagram</a>
      <a class="btn btn--ghost" data-href="tel"><span data-text="phone"></span></a>
    </div>
  </div>
</section>

<section class="section has-ribbon" style="padding-top:0" aria-labelledby="at-h">
  <div class="wrap split">
    <div class="about-visual about-visual--flip">
      <div class="about-visual__bg"><img src="assets/img/about-portrait-tall.webp" alt="" loading="lazy"></div>
      <figure class="about-visual__fg"><img src="assets/img/about-portrait.webp" alt="The founder of Adela Privé" loading="lazy"></figure>
    </div>
    <div>
      <h2 id="at-h" class="duo" data-duo="about">About me</h2>
      <p class="lead" data-i18n="atelier.teaser.text"></p>
      <a class="link" href="atelier.html" data-i18n="atelier.teaser.link">About the atelier</a>
    </div>
  </div>
