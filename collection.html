<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The collection — Adela Privé</title>
<meta name="description" content="Hand-crocheted couture purses and scarves by Adela Privé, made in Bulgaria. Enquire on Instagram or by phone.">
<meta name="theme-color" content="#680B1D">
<meta property="og:title" content="The collection — Adela Privé">
<meta property="og:description" content="Hand-crocheted couture purses and scarves. Enquire on Instagram or by phone.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Tenor+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="collection" data-title="meta.collection">
<div id="site-header"></div>
<main id="main">
  <img class="ribbon ribbon--right ribbon--pagehead" src="assets/img/ribbon.svg" alt="">

<div class="wrap">
  <header class="page-head">
    <h1 class="duo" data-duo="collection">My Collection</h1>
    <p class="lead" data-i18n="collection.text"></p>
  </header>
  <div class="filters" role="group" data-i18n-attr="aria-label:filter.label">
    <button type="button" data-filter="all" aria-pressed="true" data-i18n="filter.all">All pieces</button>
    <button type="button" data-filter="purses" aria-pressed="false" data-i18n="filter.purses">Purses</button>
    <button type="button" data-filter="scarves" aria-pressed="false" data-i18n="filter.scarves">Scarves</button>
    <div class="filters__tools">
      <label class="pickbox"><span class="visually-hidden" data-i18n="filter.material">Material</span>
        <select id="f-material"></select></label>
      <label class="pickbox"><span class="visually-hidden" data-i18n="sort.label">Sort</span>
        <select id="f-sort"></select></label>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
  </div>
  <div class="grid" id="collection-grid"></div>
</div>
<section class="section">
  <div class="wrap" style="text-align:center">
    <p class="lead" style="margin:0 auto 32px" data-i18n="order.text"></p>
    <a class="btn" href="contact.html" data-i18n="nav.enquire">Enquire</a>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
